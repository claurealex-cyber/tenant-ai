events {
    worker_connections 1024;
}

http {
    upstream server_backend {
        server server:3001;
    }

    upstream dashboard_backend {
        server dashboard:3000;
    }

    upstream tenant_site_backend {
        server tenant-site:3002;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Dashboard (dashboard.tenantai.com)
    server {
        listen 443 ssl;
        server_name dashboard.tenantai.com;

        ssl_certificate /etc/letsencrypt/live/tenantai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tenantai.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Voice/SMS server (tenantai.com — API endpoints)
    server {
        listen 443 ssl;
        server_name tenantai.com;

        ssl_certificate /etc/letsencrypt/live/tenantai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tenantai.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # WebSocket upgrade for Twilio media streams
        location /media-stream {
            proxy_pass http://server_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # Twilio webhooks + health
        location / {
            proxy_pass http://server_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Tenant sites (*.tenantai.com — wildcard subdomain)
    server {
        listen 443 ssl;
        server_name *.tenantai.com;

        ssl_certificate /etc/letsencrypt/live/tenantai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tenantai.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://tenant_site_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
